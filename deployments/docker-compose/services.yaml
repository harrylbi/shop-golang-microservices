services:

  identity-service:
    build:
      context: ../..
      dockerfile: internal/services/identity_service/Dockerfile
    container_name: identity-service
    ports:
      - "5002:5002"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # JWT disabled temporarily for observability and MTTR experiments
      DISABLE_AUTH: "true"
    depends_on:
      - postgres
      - rabbitmq
      - otel-collector
    networks:
      - shop

  inventory-service:
    build:
      context: ../..
      dockerfile: internal/services/inventory_service/Dockerfile
    container_name: inventory-service
    ports:
      - "5004:5004"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # JWT disabled temporarily for observability and MTTR experiments
      DISABLE_AUTH: "true"
    depends_on:
      - postgres
      - rabbitmq
      - otel-collector
    networks:
      - shop

  product-service:
    build:
      context: ../..
      dockerfile: internal/services/product_service/Dockerfile
    container_name: product-service
    ports:
      - "5000:5000"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # JWT disabled temporarily for observability and MTTR experiments
      DISABLE_AUTH: "true"
      # ====== Fault Injection untuk MTTR Research ======
      # Aktifkan SATU skenario pada satu waktu, lalu rebuild/restart container.
      # Skenario 1: Database Failure → HTTP 500 pada GET /api/v1/products
      #SIMULATE_DB_FAILURE: "true"
      # Skenario 2: Inventory Dependency Down → HTTP 500 pada GET /api/v1/products
      #SIMULATE_INVENTORY_DOWN: "true"
      # Skenario 3: RabbitMQ Publish Failed → HTTP 500 pada POST /api/v1/products
      #SIMULATE_RABBITMQ_FAILURE: "true"
      # Skenario 4: Slow Query (5s delay) → GET /api/v1/products tetap 200 tapi lambat
      #SIMULATE_SLOW_DB: "true"
      # Skenario 5: High CPU → GET /api/v1/products tetap 200 tapi CPU spike
      #SIMULATE_HIGH_CPU: "true"
    depends_on:
      - postgres
      - rabbitmq
      - otel-collector
    networks:
      - shop

networks:
  shop:
    name: docker-compose_shop
    external: true
