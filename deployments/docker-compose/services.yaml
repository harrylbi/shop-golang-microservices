version: '3.8'

services:
  identity-service:
    build:
      context: ../../
      dockerfile: internal/services/identity_service/Dockerfile
    container_name: identity-service
    ports:
      - "5002:5002"
      - "6602:6600"
    environment:
      - APP_ENV=docker
    networks:
      - shop

  product-service:
    build:
      context: ../../
      dockerfile: internal/services/product_service/Dockerfile
    container_name: product-service
    ports:
      - "5000:5000"
      - "6601:6600"
    environment:
      - APP_ENV=docker
    networks:
      - shop

  inventory-service:
    build:
      context: ../../
      dockerfile: internal/services/inventory_service/Dockerfile
    container_name: inventory-service
    ports:
      - "5004:5004"
    environment:
      - APP_ENV=docker
    networks:
      - shop

networks:
  shop:
    name: docker-compose_shop
    external: true
