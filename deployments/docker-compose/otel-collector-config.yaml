receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:

exporters:

  debug:
    verbosity: normal

  otlp:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"

service:

  pipelines:

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]